<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RISKI Game Vote</title>
    <meta name="description" content="Vote for the next game to be played on stream!">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar">
        <div class="navbar-top">
            <div class="logo-container">
                <h1 class="css-logo">
                    <span class="riski">Riski</span><span class="tv">TV</span>
                </h1>
                <a href="https://www.twitch.tv/RiskiTV" target="_blank" rel="noopener noreferrer" class="stream-status-link">
                    <div id="stream-status" class="stream-status-badge offline">
                        <span class="status-dot"></span>
                        <span class="status-text">Stream: OFFLINE</span>
                    </div>
                </a>
            </div>
            <div class="social-links">
                <a href="https://www.twitch.tv/RiskiTV" target="_blank" rel="noopener noreferrer" class="social-btn twitch">
                    <i class="fa-brands fa-twitch"></i>
                </a>
                <a href="https://www.youtube.com/@Riskinator" target="_blank" rel="noopener noreferrer"
                    class="social-btn youtube">
                    <i class="fa-brands fa-youtube"></i>
                </a>
            </div>
        </div>
        <div class="navbar-search">
            <div class="search-wrapper" style="position:relative">
                <i class="fa-solid fa-search search-icon"></i>
                <input type="text" id="search-input" placeholder="Spiel suchen (z.B. Counter-Strike)..."
                    autocomplete="off">
            </div>
            <div class="custom-dropdown" id="sort-dropdown">
                <button class="dropdown-trigger" id="dropdown-trigger" aria-haspopup="listbox" aria-expanded="false">
                    <span id="selected-sort">Meist gevotet</span>
                    <i class="fa-solid fa-chevron-down dropdown-arrow"></i>
                </button>
                <ul class="dropdown-options" id="dropdown-options" role="listbox">
                    <li data-value="votes" class="dropdown-option selected" role="option" aria-selected="true">Meist gevotet</li>
                    <li data-value="az" class="dropdown-option" role="option" aria-selected="false">Alphabetisch (A-Z)</li>
                    <li data-value="za" class="dropdown-option" role="option" aria-selected="false">Alphabetisch (Z-A)</li>
                </ul>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Community Game Vote</h1>
            <p>Welche Games wünscht ihr euch?</p>
        </section>



        <section class="game-list-container">
            <div id="loading" class="loading">Loading games...</div>
            <ul id="game-list" class="game-list hidden">
                <!-- Games will be injected here via JavaScript -->
            </ul>
        </section>
    </main>

    <script src="games_data.js"></script>
    <script src="epic_games_data.js"></script>
    <script src="custom_games.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="app.js"></script>
</body>

</html>
